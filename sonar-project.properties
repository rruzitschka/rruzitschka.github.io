# sonar-project.properties
# SonarQube analysis config for SendLog Website

sonar.projectKey=SendLogWebsite
sonar.projectName=SendLog Website
sonar.projectVersion=1.0
sonar.host.url=http://localhost:9000

# Sources and tests
sonar.sources=app/js,scripts,pages
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# JavaScript/Node.js
sonar.language=js

# Exclude generated and third-party files
sonar.exclusions=\
  node_modules/**,\
  graphify-out/**,\
  mocks/**,\
  docs/**,\
  brainstorm/**,\
  images/**

# Coverage — LCOV from vitest, scoped to pure-logic modules only.
# Browser-side UI files (stats.js, ui.js, admin.js etc.) require a live
# DOM and cannot be meaningfully unit-tested; excluding them from coverage
# keeps the gate honest about the modules that ARE exercised by tests.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=\
  app/js/stats.js,\
  app/js/ui.js,\
  app/js/admin.js,\
  app/js/training.js,\
  app/js/firebase-auth.js,\
  app/js/firebase-api-keys.js,\
  app/js/firebase-config.js,\
  app/js/mock.js

sonar.test.inclusions=\
  tests/**/*.test.js,\
  tests/**/*.spec.js
